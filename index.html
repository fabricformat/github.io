<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Coze Web SDK</title>
  <style>
    * { box-sizing: border-box; }
    html { height: 100%; }
    body { margin: 0; min-height: 100%; padding: 8px; font: 16px system-ui,sans-serif; color: #1e2633; }
    main { max-width: 28rem; margin: clamp(2rem,10vh,7rem) auto; padding: 1rem; }
    input, button { display: block; width: 100%; padding: .75rem; margin: .5rem 0 1rem; font: inherit; }
    #status { min-height: 1.5em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main id="gate">
  <h1>扣子演示</h1>
  <p>请输入演示访问码。请勿在此输入扣子的访问令牌。</p>
  <form id="unlock">
    <label for="code">演示访问码</label>
    <input id="code" type="password" required autocomplete="off" spellcheck="false">
    <button id="start" type="submit">打开演示</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="./coze-demo.mjs"></script>
</body>
</html>
